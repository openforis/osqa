# The scheduled commands, one CronJob each (times in UTC). Every run's outcome
# is recorded and exported by /metrics as
# osqa_cron_last_success_timestamp_seconds{command="..."}: alert on it
# (docs/prometheus/alerts.yml) rather than on Job failures alone.
---
# Daily email digests
apiVersion: batch/v1
kind: CronJob
metadata:
  name: osqa-send-email-alerts
  labels: {app.kubernetes.io/name: osqa, app.kubernetes.io/component: cron}
spec:
  schedule: "15 6 * * *"
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels: {app.kubernetes.io/name: osqa, app.kubernetes.io/component: cron}
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999}
          containers:
            - name: send-email-alerts
              image: osqa
              args: ["python", "manage.py", "send_email_alerts"]
              envFrom:
                - configMapRef: {name: osqa-config}
                - secretRef: {name: osqa-secrets}
              resources:
                requests: {cpu: 50m, memory: 256Mi}
                limits: {memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
---
