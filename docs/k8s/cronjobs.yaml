# Database + uploads archive into the osqa-backups volume
apiVersion: batch/v1
kind: CronJob
metadata:
  name: osqa-backup-site
  labels: {app.kubernetes.io/name: osqa, app.kubernetes.io/component: cron}
spec:
  schedule: "30 3 * * *"
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels: {app.kubernetes.io/name: osqa, app.kubernetes.io/component: cron}
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999}
          containers:
            - name: backup-site
              image: osqa
              args: ["python", "manage.py", "backup_site"]
              envFrom:
                - configMapRef: {name: osqa-config}
                - secretRef: {name: osqa-secrets}
              resources:
                requests: {cpu: 50m, memory: 256Mi}
                limits: {memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: uploads, mountPath: /app/forum/upfiles, readOnly: true}
                - {name: backups, mountPath: /app/backups}
          volumes:
            - name: uploads
              persistentVolumeClaim: {claimName: osqa-uploads}
            - name: backups
              persistentVolumeClaim: {claimName: osqa-backups}
---
